[project]
name = "Riki-mem"
version = "0.2.0"
description = "Standalone long-term memory layer for AI agents: LLM extraction, hybrid retrieval (keyword + semantic + time + graph), dedup, and consolidation. Postgres + pgvector, bring your own LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Subhadip Mondal" }]
keywords = ["ai", "agents", "memory", "rag", "long-term-memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.0",
    "httpx>=0.27",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
riki = "riki_memory.cli:main"

[project.urls]
Homepage = "https://github.com/16bitOni/Riki-mem"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riki_memory"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mcp>=1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
